# RoboRally - CentOS / RHEL / Rocky, plain HTTP
#
#   sudo cp roborally-centos.conf /etc/httpd/conf.d/
#   sudo apachectl configtest
#   sudo systemctl reload httpd
#
# Unlike Debian there is no sites-available/sites-enabled and no a2enmod:
# anything in /etc/httpd/conf.d/*.conf is loaded, and the proxy modules are
# already enabled by /etc/httpd/conf.modules.d/00-proxy.conf. Confirm with:
#
#   httpd -M | grep -E 'proxy|rewrite|headers'
#
# BEFORE THIS WILL WORK, SELinux must be told httpd may open a network
# connection to the Node process. Without it every /api request is a 503
# and the error log says "Permission denied: AH00957":
#
#   sudo setsebool -P httpd_can_network_connect 1

<VirtualHost *:80>
    ServerName roborally.local
    ServerAlias localhost

    DocumentRoot /var/www/roborally/public

    <Directory /var/www/roborally/public>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None

        # Single-page client: a deep link such as /games/12 must serve
        # index.html on a hard refresh rather than 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>

    # Board art, straight off disk rather than through Node.
    Alias /boards /var/www/roborally/boards
    <Directory /var/www/roborally/boards>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    # ---------------------------------------------------------------
    # The SSE stream. MUST come before the general /api rule: ProxyPass
    # matches in order and the first match wins.
    # ---------------------------------------------------------------
    #
    # NOTE on flushing. An earlier version of this file carried
    # `flushpackets=on`. Apache documents that parameter as applying to
    # mod_proxy_ajp, _fcgi, _scgi and _uwsgi -- NOT mod_proxy_http, which
    # is what this uses. It has been removed; depending on the Apache
    # build it is either ignored or a config error.
    #
    # What actually keeps the stream flowing with mod_proxy_http:
    #   * no compression (mod_deflate buffers, which defeats streaming)
    #   * chunked transfer to the client
    #   * the application's own heartbeat, every 20 seconds
    #
    # Verify rather than assume, with:  curl -N http://localhost/api/games/1/stream
    #
    <Location /api/games>
        SetEnv no-gzip 1
        SetEnv proxy-sendchunked 1
        # Belt and braces: exclude the stream content type from deflate
        # even if it is enabled globally elsewhere.
        <IfModule mod_deflate.c>
            SetEnvIfNoCase Request_URI "/stream$" no-gzip dont-vary
        </IfModule>
    </Location>

    ProxyPassMatch "^/api/games/([0-9]+)/stream$" \
        "http://127.0.0.1:3001/api/games/$1/stream" \
        timeout=3600 connectiontimeout=5

    # ---------------------------------------------------------------
    # Everything else under /api
    # ---------------------------------------------------------------
    ProxyPass        /api/ http://127.0.0.1:3001/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPreserveHost On
    ProxyRequests Off

    # No X-Forwarded-Proto here: this vhost really is plain http. Setting
    # it to https would make express mark the session cookie `secure`, and
    # the browser would then refuse to send it back over http, so every
    # request after sign-in would come back 401.

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    # Relative to ServerRoot (/etc/httpd), so these land in /var/log/httpd.
    # There is no APACHE_LOG_DIR variable on this distribution.
    ErrorLog  logs/roborally-error.log
    CustomLog logs/roborally-access.log combined
</VirtualHost>
