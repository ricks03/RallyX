"Cliffs":
  file: Cliffs.tsx
  # Elevation. Every tile in this sheet is drawn from below, so the cell
  # carrying it is the LOW side and the high ground lies across the marked
  # edge: `drop: in`. Moving out across the edge is uphill, blocked like a
  # wall unless the edge carries a ramp, which costs one extra move. Moving in
  # across it is a fall for 2 damage. Ramps have no effect downhill.
  #
  # "Ramps/Ledges" is drawn the same way round and is also all `drop: in`. The
  # polarity is written on every entry rather than assumed anyway, because a
  # sheet that disagreed would be invisible to both tools.
  #
  # Tiles 0-2, 4-6 and 8-10 are a nine-slice for a raised area: the eight ring
  # pieces are transparent overlays laid on the low cells around it, tile 5 is
  # the high ground itself. The four corners share no orthogonal edge with the
  # high ground, so they are art only.
  #
  # Directions are for the unrotated tile: left W, right E, top N, bottom S.
  0:  { kind: ignore }   # NW corner of the nine-slice
  2:  { kind: ignore }   # NE corner
  8:  { kind: ignore }   # SW corner
  10: { kind: ignore }   # SE corner
  1:  { kind: cliff, drop: in, edge: S }
  4:  { kind: cliff, drop: in, edge: E }
  6:  { kind: cliff, drop: in, edge: W }
  3:
    - { kind: cliff, drop: in, edge: W }
    - { kind: cliff, drop: in, edge: S }
  9:  { kind: cliff, drop: in, edge: N, ramp: true }
  7:
    - { kind: floor }
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: S, ramp: true }
  12:
    - { kind: floor }
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: S }
  13:
    - { kind: floor }
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: W }
  14:
    - { kind: floor }
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: W }
    - { kind: cliff, drop: in, edge: E }
  5:  { kind: floor }    # dirt, the high ground of the nine-slice
  11: { kind: floor }    # dirt
  15: { kind: pit }      # mine shaft

"Ramps/Ledges":
  file: Ledges.tsx
  # Ledges are cliffs; the ramps here are the same element as Cliffs ramps.
  #
  # Same polarity as "Cliffs". The yellow hazard stripe is the raised edge and
  # the middle of the tile is the low floor, so the cell carrying a striped
  # edge is the LOW side and the high ground is across it: `drop: in`.
  #
  # Several of these tiles are partial art meant to be layered to build a
  # particular picture, so the same cell can carry more than one and the same
  # edge can be written more than once. The library keeps them consistent; the
  # converter warns if two layered tiles disagree about an edge.
  #
  # A ramp costs one extra move uphill. `steep: true` makes it two. Steepness
  # is baked into the art on 4, 9 and 10.
  #
  # Which edges are striped, where the stripe breaks for a ramp, and which
  # tiles carry the "steep" label were all measured off the sheet.
  0:  { kind: ignore }                                    # corner art, no stripe
  1:  { kind: cliff, drop: in, edge: S }
  2:  { kind: cliff, drop: in, edge: S, ramp: true }
  3:
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: E }
  4:  { kind: cliff, drop: in, edge: E, ramp: true, steep: true }
  5:  { kind: cliff, drop: in, edge: S }
  6:
    - { kind: cliff, drop: in, edge: S }
    - { kind: cliff, drop: in, edge: E }
  8:
    - { kind: cliff, drop: in, edge: N }
    - { kind: cliff, drop: in, edge: E, ramp: true }
  9:
    - { kind: cliff, drop: in, edge: N }
    - { kind: cliff, drop: in, edge: E, ramp: true, steep: true }
  10:
    - { kind: cliff, drop: in, edge: N, ramp: true, steep: true }
    - { kind: cliff, drop: in, edge: E }
  11: { kind: cliff, drop: in, edge: S }
  12:
    - { kind: cliff, drop: in, edge: N }
    - { kind: cliff, drop: in, edge: S }
  13: { kind: floor }
  14: { kind: floor }
  15: { kind: floor }
  16: { kind: floor }
  17: { kind: cliff, drop: in, edge: S }
  22: { kind: cliff, drop: in, edge: S, ramp: true }
  27: { kind: cliff, drop: in, edge: S }
  28: { kind: cliff, drop: in, edge: S }
  29: { kind: floor }
  # Partial pieces. These stripe only part of an edge because they are drawn to
  # combine, but the edge they mark is a real boundary all the same.
  7:
    - { kind: cliff, drop: in, edge: S, ramp: true }
    - { kind: cliff, drop: in, edge: E, ramp: true }
  19: { kind: cliff, drop: in, edge: S }
  20: { kind: cliff, drop: in, edge: S }
  21:
    - { kind: cliff, drop: in, edge: S }
    - { kind: cliff, drop: in, edge: E }
  23:
    - { kind: cliff, drop: in, edge: S, ramp: true }
    - { kind: cliff, drop: in, edge: W }
  24:
    - { kind: cliff, drop: in, edge: N, ramp: true }
    - { kind: cliff, drop: in, edge: W }
  25:
    - { kind: cliff, drop: in, edge: S, ramp: true }
    - { kind: cliff, drop: in, edge: W }
    - { kind: cliff, drop: in, edge: E }
  # The word "steep" on its own, laid over a ramp to upgrade it. Steepness uses
  # both conventions in this sheet, the same way pusher phases do: baked into
  # the art on 4, 9 and 10, layered as this overlay everywhere else.
  # Unrotated it names the ramp running from the centre of the tile to the
  # right, so edge E, and it rotates with the tile like any other direction.
  26: { kind: steepMarker, edge: E }
  18: { kind: ignore }   # art only, same as 0 and 13-16
  # Row 6, added this session: the sheet was extended by one row (30->36
  # tiles, tilecount/image height updated in Ledges.tsx, columns unchanged
  # so every earlier id is untouched). Tile 30 draws a genuine 2-level drop
  # on its south edge - confirmed against the real Straightaway6 board and
  # the project owner's own numbers ((4,1)=-1, (4,2)=-1, (4,3)=+1), and
  # distinct from the ordinary "layered partial pieces" convention used
  # everywhere else on this sheet: this is new art specifically drawn to
  # show two levels, not a decorative fragment of one. 31-35 are blank.
  30: { kind: cliff, drop: in, edge: S, levels: 2 }
  31: { kind: ignore }
  32: { kind: ignore }
  33: { kind: ignore }
  34: { kind: ignore }
  35: { kind: ignore }

