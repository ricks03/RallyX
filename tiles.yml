"5e_Exp1":
  file: 5e_Exp1.tsx
  # A mixed expansion sheet: water and currents on row 0, crushers with their
  # digits on rows 1-4, and a few one-off devices on row 5. Only what Capstone4
  # places is labelled so far; the rest stops the parser rather than guessing.
  #
  # Water, per the Board Elements reference: the first square of a movement is
  # negated, so a Back-Up or Move 1 does not move and a Move 2 advances one.
  # Moving INTO water from a non-water square treats it as open floor.
  #
  # Currents are water as well, so those tiles carry two elements. Directions
  # are for the unrotated tile: left is W, right E, top N, bottom S.
  # A curved current rotates a robot 90 degrees the way a curved belt does.
  0:
    - { kind: water }
    - { kind: current, exit: E, entries: [W] }
  1:  { kind: water }
  # A drain. The reference says to treat drains as pits, and the sheet draws it
  # as a whirlpool rather than a hole, but the effect is the same: destroyed.
  2:  { kind: pit }
  3:
    - { kind: water }
    - { kind: current, exit: S, entries: [W] }
  4:
    - { kind: water }
    - { kind: current, exit: E, entries: [W] }   # same as 0, different art
  5:
    - { kind: water }
    - { kind: current, exit: S, entries: [N, W] }
  15:
    - { kind: water }
    - { kind: current, exit: S, entries: [W, E] }
  50: { kind: randomizer }
  51: { kind: teleporter }
  # A ramp running bottom to top: the high ground is north, so the cell is the
  # low side and the ramp crosses its N edge. Same shape as every other ramp
  # in the library. The art agrees, hugging the north edge and tapering south.
  52: { kind: cliff, drop: in, edge: N, ramp: true }
  # columns 6-9 of every row are blank, as are c3 of rows 3, 4 and 5
  # crusher banks: the registers are baked into the art
  10: { kind: crusher, phases: [1] }
  11: { kind: crusher, phases: [2] }
  12: { kind: crusher, phases: [3] }
  13: { kind: crusher, phases: [4] }
  14: { kind: crusher, phases: [5] }
  20: { kind: crusher, phases: [1] }
  21: { kind: crusher, phases: [2] }
  22: { kind: crusher, phases: [3] }
  23: { kind: crusher, phases: [4] }
  24: { kind: crusher, phases: [5] }
  30: { kind: crusher, phases: [2, 4] }
  40: { kind: crusher, phases: [2, 4] }
  # blank crushers - digits layered on separately
  31: { kind: crusher }
  41: { kind: crusher }
  32: { kind: wall, edge: W }
