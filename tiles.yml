"Floor Elements":
  file: Floor Elements.tsx
  # Repair sites. EVERY repair space archives the robot each register; the
  # icon says what else it does:
  #   one wrench          heals 1
  #   two wrenches        heals 2 OR grants an option/upgrade on register 5
  #   wrench and hammer   heals 1 AND grants an option/upgrade at the end of
  #                       register 5
  # So `hammer: true` is what separates the third from the first, not the
  # wrench count - it heals the same 1.
  # All three are on this sheet: 0, 2 and 1 in that order.
  0:  { kind: repair, wrenches: 1 }
  2:  { kind: repair, wrenches: 2 }
  1:  { kind: repair, wrenches: 1, hammer: true }
  # Chop shop. Each register it either swaps an option/upgrade for a random
  # one or reloads one, and on register 5 it grants a new option/upgrade.
  3:  { kind: chopShop }
  # A teleporter is its own element, not a portal, and it sits ON a floor
  # space rather than being one. It boosts movement rather than relocating a
  # robot: one executing a move card (not Rotate, not U-Turn) on a teleporter
  # moves forward 2 plus the forward movement on the card, provided the
  # movement is not affected by an option and the destination is unoccupied.
  # Nothing pairs, so the tile carries no fields.
  4:  { kind: teleporter }
  5:  { kind: ignore }
  # Starting markers for positions 1-8. Robots may be placed on them at the
  # start of a game; they have no other effect, so they ride on the cell
  # rather than being its floor.
  6:  { kind: startPosition, number: 1 }
  7:  { kind: startPosition, number: 2 }
  8:  { kind: startPosition, number: 3 }
  9:  { kind: startPosition, number: 4 }
  12: { kind: startPosition, number: 5 }
  13: { kind: startPosition, number: 6 }
  14: { kind: startPosition, number: 7 }
  15: { kind: startPosition, number: 8 }
  # A robot beginning a register on a randomizer draws a random card from the
  # deck and executes it instead of whatever it programmed for that register.
  16: { kind: randomizer }
  # art with no game effect
  10: { kind: ignore }
  11: { kind: ignore }
  17: { kind: ignore }
  18: { kind: ignore }
  19: { kind: ignore }
  20: { kind: ignore }
  21: { kind: ignore }
  22: { kind: ignore }
  # a timed pit: open only on the registers collected from the digits below
  23: { kind: trapDoorPit }
  24: { kind: phaseDigit, digit: 1, for: trapDoorPit }
  25: { kind: phaseDigit, digit: 2, for: trapDoorPit }
  26: { kind: phaseDigit, digit: 3, for: trapDoorPit }
  27: { kind: phaseDigit, digit: 2, for: trapDoorPit }   # duplicate of 25
  28: { kind: phaseDigit, digit: 4, for: trapDoorPit }
  29: { kind: phaseDigit, digit: 5, for: trapDoorPit }

