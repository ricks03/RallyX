"RallyX":
  file: RallyX.tsx
  # Ground hazards
  0:  { kind: smoke }        # blocks laser fire; sits over the floor
  1:  { kind: spikes }       # 1 damage on entering, or on rotating in place
  3:  { kind: spikes }       # spiked floor, same effect as 1
  2:  { kind: speedBump }    # 1 damage when entered on a Move 2 or Move 3
  5:  { kind: flamingOil }   # flamethrower and oil slick combined
  8:  { kind: oil }
  # Service squares. Engine rules, recorded here only as identity:
  #  pitStop  - ending a register phase on one removes 1 damage and discards
  #             the next register's programmed cards and tokens; the robot is
  #             wholly inactive that next phase even if it has moved off.
  #             No effect on register 5.
  #  restStop - ending a register phase on one having executed neither a Move
  #             nor a Back-Up removes 1 damage.
  6:  { kind: pitStop }
  10: { kind: restStop }
  # Stunt ramps: enter at the bottom, leave at the top. Unlike a normal ramp,
  # which consumes a move, these ADD one move on exit.
  7:  { kind: stuntRamp, entry: S, exit: N }
  11: { kind: stuntRamp, entry: S, exit: N }
  # Walls. Spikes always face into the cell - a west wall's spikes point east,
  # a south wall's point north - so the direction is derived, not stored.
  # A spiked wall damages anything moved, slid or pushed into it.
  9:  { kind: wall, edge: W, spikes: true }
  12: { kind: wall, edge: W, spikes: true }   # same as 9
  15: { kind: wall, edge: W }                 # no spikes
  13:
    - { kind: wall, edge: W, spikes: true }
    - { kind: wall, edge: S, spikes: true }
  14:
    - { kind: wall, edge: W }                 # plain
    - { kind: wall, edge: S, spikes: true }
  # Slime. Hinders movement: a robot starting its move on slime ignores
  # Rotate Left/Right, U-Turn, Back-Up and Move 1 - the card is discarded and
  # the robot does not move. Only Move 2 or Move 3 gets it off. It can still
  # be pushed off. Resolved in the Robots Move segment at the priority of the
  # movement card.
  4:  { kind: slime }

"Bollards":
  file: Bollards.tsx
  # A bollard is a timed wall: a wall on its listed registers, open floor on
  # every other one. Column position in the sheet gives the edge, row gives
  # the digit. A centred bar blocks one axis, so it is recorded as bollards
  # on both perpendicular edges - placing a centred horizontal AND a centred
  # vertical seals the cell completely, walls on all four sides.
  #
  # Tiles 0-5 carry all five numbers as reference art only; their real
  # registers come from the marker tiles layered on top, same as 6, 13, 20.
  0:
    - { kind: bollard, edge: N }
    - { kind: bollard, edge: S }   # centre-H
  1:  { kind: bollard, edge: N }   # north
  2:
    - { kind: bollard, edge: E }
    - { kind: bollard, edge: W }   # centre-V
  3:  { kind: bollard, edge: S }   # south
  4:  { kind: bollard, edge: W }   # west
  5:  { kind: bollard, edge: E }   # east
  # blanks awaiting layered numbers
  6:
    - { kind: bollard, edge: N }
    - { kind: bollard, edge: S }   # centre-H, blank
  13: { kind: bollard, edge: S }   # south, blank
  20:
    - { kind: bollard, edge: E }
    - { kind: bollard, edge: W }   # centre-V, blank
