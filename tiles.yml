  7 : { kind: phaseDigit, digit: 1, for: bollard, edges: [N, S] }  # centre-H
  8 : { kind: phaseDigit, digit: 1, for: bollard, edges: [N, W] }  # north + west
  9 : { kind: phaseDigit, digit: 1, for: bollard, edges: [E, W] }  # centre-V
  10: { kind: phaseDigit, digit: 1, for: bollard, edges: [S] }  # south
  11: { kind: phaseDigit, digit: 1, for: bollard, edges: [W] }  # west
  12: { kind: phaseDigit, digit: 1, for: bollard, edges: [E] }  # east
  14: { kind: phaseDigit, digit: 2, for: bollard, edges: [N, S] }  # centre-H
