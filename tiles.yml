# Tile semantics table for the RoboRally TMX parser.
#
# Keyed by tileset name (the `name` attribute in the .tsx), then tile id.
# Tile ids are row-major, zero-indexed: id = row * columns + col
#
# `kind` values the parser understands:
#   floor        plain floor plate
#   conveyor     + express: bool, + exit: dir, + entries: [dir,..]
#   gear         + rotation: CW | CCW
#   repair       + wrenches: 1 | 2, + hammer: bool
#   wall         + edge: dir   (edge feature)
#   pit          instant destruction
#   trapDoorPit  pit only on the phases collected from digit overlays
#   pusher       + edge: dir, + phases: [..] baked in, or [] if digits layered
#   phaseDigit   + digit: N   overlay contributing a phase number
#   cliff        + edge: dir, + drop: in|out, + ramp: bool, + steep: bool
#                one-way elevation edge; drop says which side is high
#   steepMarker  + edge: dir   overlay making the ramp on that edge steep
#   repulsor     + edge: dir   edge feature that shoves robots back
#   ignore       decorative, no game meaning
#
# Directions are given for the tile as it sits in the sheet, UNROTATED.
# Tiled's flip flags are applied to them at parse time, which covers all
# eight orientations including mirrors.
#
# Anything not listed here makes the parser stop and name the tile.
# That is deliberate: an unknown tile is a bug, not a default.

