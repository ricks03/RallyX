"Oil & Goo":
  file: Oil & Goo.tsx
  # Every black shape is oil slick; the many outlines are for tiling across
  # adjacent cells and carry no meaning.
  #
  # Oil slick, per the Board Elements reference: a robot that tries to END its
  # movement on oil keeps sliding the way it was going until a wall or a robot
  # not on oil stops it, or until it is off the oil; sliding into a robot that
  # is itself on oil slides them both. A robot still mid-move behaves normally.
  # A robot that BEGINS its movement on oil loses the first square of it.
  # Rotate cards are unaffected.
  0:  { kind: oil }
  1:  { kind: oil }
  2:  { kind: oil }
  3:  { kind: oil }
  4:  { kind: oil }
  5:  { kind: oil }
  7:  { kind: oil }
  8:  { kind: oil }
  9:  { kind: oil }
  10: { kind: oil }
  11: { kind: oil }
  12: { kind: oil }
  14: { kind: oil }
  15: { kind: oil }
  16: { kind: oil }
  17: { kind: oil }
  18: { kind: oil }
  21: { kind: oil }
  22: { kind: oil }
  23: { kind: oil }
  24: { kind: oil }
  25: { kind: oil }
  28: { kind: oil }
  29: { kind: oil }
  30: { kind: oil }
  31: { kind: oil }
  # Goo behaves as slime, so it is recorded as slime rather than as a kind of
  # its own. Slime: a robot starting its move on one ignores Rotate, U-Turn,
  # Back-Up and Move 1, discarding the card without moving; only a Move 2 or
  # Move 3 gets it off, though it can still be pushed off.
  6:  { kind: slime }
  13: { kind: slime }
  20: { kind: slime }
  27: { kind: slime }
  34: { kind: slime }
  # 19, 26 are ~1% coverage - UNCONFIRMED, assumed stray fragments
  19: { kind: ignore }
  26: { kind: ignore }
  # Repulsor field on the west edge, plus two lasers emitted from that edge
  # and crossing the cell eastward.
  #
  # Repulsor field, per the Board Elements reference: a robot that RUNS INTO
  # the field is shoved directly away from it by as many squares as its
  # movement card, and loses whatever movement was left on that card. A robot
  # PUSHED into the field by another robot is shoved away by the pushing
  # robot's card instead, and it is the pusher that loses its remaining
  # movement. Robots being shoved by a repulsor can push others along. Nothing
  # else triggers it: only running into a field, or being pushed into one.
  # Resolved during Robots Move.
  32:
    - { kind: repulsor, edge: W }
    - { kind: laser, edge: W, count: 2 }
  # two lasers crossing east-west with no emitter in this cell
  33: { kind: laserBeam, along: E, count: 2 }

"Crushers/Flamers":
  file: Crushers & Flamers300.tsx
  # Orange and green flamers are separate items with the same effect, so they
  # share the `flamer` kind and are told apart by `colour`. The engine can
  # treat them identically and still know which is which.
  # 0 is a self-contained single flame space with a wall on its south edge.
  # 7 is a flame space with no wall, meant to connect southward.
  # 14 carries the south wall and connects to flames to its north.
  0:
    - { kind: flamer, colour: orange }
    - { kind: wall, edge: S }
  7:  { kind: flamer, colour: orange }
  14:
