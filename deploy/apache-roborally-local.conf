# RoboRally - local test server, plain HTTP, no TLS
#
# For the home box. Use apache-roborally.conf on Linode instead, which
# adds TLS and the redirect.
#
# Reach it at http://roborally.local/ or http://localhost:8080/ depending
# on which Listen line you use below.
#
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo cp apache-roborally-local.conf /etc/apache2/sites-available/
#   sudo a2ensite apache-roborally-local
#   sudo apachectl configtest
#   sudo systemctl reload apache2

# If port 80 is already taken by the default site, uncomment this and use
# *:8080 in the VirtualHost line instead.
# Listen 8080

<VirtualHost *:80>
    ServerName roborally.local
    # Also answer to localhost, so no hosts-file entry is needed.
    ServerAlias localhost

    DocumentRoot /var/www/roborally/public

    <Directory /var/www/roborally/public>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None

        # Single-page client: a deep link like /games/12 must still serve
        # index.html on a hard refresh, or the browser gets a 404.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>

    # Board art, served straight off disk. Not through Node: these are
    # static images and Apache is better at it.
    Alias /boards /var/www/roborally/boards
    <Directory /var/www/roborally/boards>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    # ---- SSE stream. MUST come before the general /api rule. ----
    <Location /api/games>
        SetEnv no-gzip 1
        SetEnv proxy-sendchunked 1
    </Location>

    ProxyPassMatch "^/api/games/([0-9]+)/stream$" \
        "http://127.0.0.1:3001/api/games/$1/stream" \
        timeout=3600 connectiontimeout=5

    # ---- Everything else under /api ----
    ProxyPass        /api/ http://127.0.0.1:3001/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPreserveHost On
    ProxyRequests Off

    # No X-Forwarded-Proto here: this vhost really is plain http, and
    # setting it to https would make express mark the session cookie
    # `secure`, which the browser would then refuse to send back.

    ErrorLog  ${APACHE_LOG_DIR}/roborally-error.log
    CustomLog ${APACHE_LOG_DIR}/roborally-access.log combined
</VirtualHost>
