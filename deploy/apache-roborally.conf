# RoboRally - Apache virtual host
#
# Apache does TLS, serves the client files, and proxies the API to the Node
# process. Node listens on 127.0.0.1:3001 and is not reachable from outside
# the machine, so Apache is the only way in.
#
# ---------------------------------------------------------------
# Required modules. Enable once, then restart:
#
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo systemctl restart apache2
#
# Note: mod_proxy_wstunnel is NOT needed. This server uses server-sent
# events, which are ordinary HTTP responses that stay open, so plain
# mod_proxy_http carries them. It would only be needed if the transport
# were switched to websockets.
# ---------------------------------------------------------------

<VirtualHost *:80>
    ServerName roborally.example.com

    # Everything except the ACME challenge goes to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName roborally.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/roborally.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/roborally.example.com/privkey.pem

    # ---------------------------------------------------------------
    # The client. Static files, served directly by Apache.
    # ---------------------------------------------------------------
    DocumentRoot /var/www/roborally/public

    <Directory /var/www/roborally/public>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None

        # Single-page client: unknown paths fall through to index.html so
        # a deep link works on a hard refresh. Real files are served as-is.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule . /index.html [L]
    </Directory>

    # ---------------------------------------------------------------
    # The SSE stream. MUST come before the general /api rule, because
    # ProxyPass matches in order and the first match wins.
    # ---------------------------------------------------------------
    #
    # NOTE: `flushpackets=on` was removed from this rule. Apache scopes
    # that parameter to mod_proxy_ajp/_fcgi/_scgi/_uwsgi, NOT to
    # mod_proxy_http which is what this uses; depending on the build it is
    # either ignored or a config error. What keeps the stream flowing here
    # is no compression, chunked transfer, and the app's own 20-second
    # heartbeat. Verify with: curl -N .../stream
    #
    # Two things matter here:
    #
    #   timeout=3600      the default (60s) closes an idle stream; the app
    #                     sends a heartbeat every 20s, so this is a
    #                     backstop rather than the primary keep-alive
    #   no-gzip           compression buffers, defeating the flush
    #
    <Location /api/games>
        # Applies to the /stream sub-paths; harmless on the others.
        SetEnv no-gzip 1
        SetEnv proxy-sendchunked 1
    </Location>

    ProxyPassMatch "^/api/games/([0-9]+)/stream$" \
        "http://127.0.0.1:3001/api/games/$1/stream" \
        timeout=3600 connectiontimeout=5

    # ---------------------------------------------------------------
    # Everything else under /api
    # ---------------------------------------------------------------
    ProxyPass        /api/ http://127.0.0.1:3001/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    # Node needs to know the request was HTTPS, or the session cookie's
    # `secure` flag is never set and express sees http.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # Never proxy in the other direction: nothing outside should be able
    # to make this Apache fetch arbitrary URLs.
    ProxyRequests Off

    # ---------------------------------------------------------------
    # Headers
    # ---------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Hide the exact Apache version from responses. Also set
    # `ServerTokens Prod` in the global config; it cannot go here.
    ServerSignature Off

    ErrorLog  ${APACHE_LOG_DIR}/roborally-error.log
    CustomLog ${APACHE_LOG_DIR}/roborally-access.log combined
</VirtualHost>

# ---------------------------------------------------------------
# Not set here, but worth knowing:
#
# ServerTokens Prod
#     Goes in /etc/apache2/conf-available/security.conf, not a vhost.
#
# MPM choice
#     Every open SSE stream occupies one Apache worker for as long as the
#     client is watching. With the default mpm_prefork that is one PROCESS
#     per watcher, which gets expensive fast. Switch to mpm_event:
#
#       sudo a2dismod php8.2 mpm_prefork   # php module forces prefork
#       sudo a2enmod mpm_event
#
#     If PHP is needed on the same server for something else, run it via
#     php-fpm instead of mod_php so mpm_event can stay.
#
# MaxRequestWorkers
#     Default is 150. Each watching player holds one for the whole game, so
#     the practical concurrent-watcher ceiling is that number minus normal
#     traffic. Raise it in mpm_event.conf if more are expected.
# ---------------------------------------------------------------
